name: Build Multi-Platform (Windows & macOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-mac:
    name: Build macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Package macOS binaries
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApexTelemetry-macOS-Universal
          path: dist-binaries/*.dmg
